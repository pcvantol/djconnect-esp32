name: Firmware CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@a73237f907554b2fba16e0e168d5fde22ce75455
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect-esp32

  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.x"

      - name: Install native test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio gcovr
          mkdir -p release/ci-native
          REPORT_DIR=release/ci-native scripts/update_build_dependencies.sh t_embed_cc1101

      - name: Upload native dependency report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-dependencies-ci-native
          path: release/ci-native/*
          if-no-files-found: ignore

      - name: Build native unit tests
        run: |
          c++ -std=c++17 \
            -Iinclude \
            -I.pio/libdeps/t_embed_cc1101/ArduinoJson/src \
            test/native/test_logic.cpp \
            -o /tmp/djconnect_unit_tests

      - name: Run native unit tests
        run: /tmp/djconnect_unit_tests

      - name: Generate native coverage
        run: scripts/run_native_coverage.sh

      - name: Upload native coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: esp32-native-cobertura-coverage
          path: release/native-coverage/djconnect-esp32-native-coverage.xml
          if-no-files-found: error

  postman-collections:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.x"

      - name: Validate Postman collections
        run: python3 test/native/test_postman_collections.py

      - name: Validate web portal i18n
        run: python3 test/native/test_webportal_i18n.py

  ha-contract-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Run ESP32 HTTP contract e2e
        run: node Tools/http_e2e_contract.js

      - name: Run ESP32 WebSocket contract e2e
        run: node Tools/websocket_e2e_contract.js

      - name: Validate contract log redaction
        run: node Tools/validate_contract_redaction.js

  release-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.x"

      - name: Run release-script checks
        run: bash test/native/test_release.sh

      - name: Run release dry-run
        run: ./release.sh 99.99.99 --dry-run

  platformio-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio

      - name: Update build dependencies
        run: |
          mkdir -p release/ci-platformio
          REPORT_DIR=release/ci-platformio scripts/update_build_dependencies.sh t_embed_cc1101

      - name: Upload PlatformIO dependency report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-dependencies-ci-platformio
          path: release/ci-platformio/*
          if-no-files-found: ignore

      - name: Build LilyGO firmware
        run: pio run -e t_embed_cc1101

  cleanup-workflow-runs:
    needs:
      - native-tests
      - postman-collections
      - ha-contract-e2e
      - release-script
      - platformio-build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete older completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          KEEP_RUNS: "2"
        run: |
          set -euo pipefail

          current_workflow_id=$(gh api \
            "repos/${REPO}/actions/runs/${CURRENT_RUN_ID}" \
            --jq '.workflow_id')

          workflows=$(gh api \
            --paginate \
            --slurp \
            "repos/${REPO}/actions/workflows" | \
            jq -r 'map(.workflows[]) | .[].id')

          for workflow_id in ${workflows}; do
            keep_limit="${KEEP_RUNS}"
            if [ "${workflow_id}" = "${current_workflow_id}" ]; then
              keep_limit=$((KEEP_RUNS - 1))
            fi

            mapfile -t run_ids < <(gh api \
              --paginate \
              --slurp \
              "repos/${REPO}/actions/workflows/${workflow_id}/runs?status=completed&per_page=100" | \
              jq -r 'map(.workflow_runs[]) | sort_by(.created_at) | reverse | .[].id')

            if ((${#run_ids[@]} <= keep_limit)); then
              continue
            fi

            for index in "${!run_ids[@]}"; do
              run_id="${run_ids[${index}]}"
              if ((index < keep_limit)) || [ "${run_id}" = "${CURRENT_RUN_ID}" ]; then
                continue
              fi

              gh api \
                --method DELETE \
                "repos/${REPO}/actions/runs/${run_id}"
            done
          done
