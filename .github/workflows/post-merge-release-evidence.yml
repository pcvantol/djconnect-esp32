name: Post-Merge Release Evidence

on:
  workflow_run:
    workflows: [Firmware CI]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: pcvantol/djconnect/.github/workflows/post-merge-release-evidence.yml@90f2f18c4bc9401ac7f0fdf37728f19ee6d9c1e4
    with:
      policy_source_ref: 90f2f18c4bc9401ac7f0fdf37728f19ee6d9c1e4
      required_main_workflow: Firmware CI
      repository_role: active_source
      coverage_artifact_name: esp32-native-cobertura-coverage
