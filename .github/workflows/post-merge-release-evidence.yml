name: Post-Merge Release Evidence

on:
  workflow_run:
    workflows: [Firmware CI]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/post-merge-release-evidence-org-487.yml@4025a68add8ba98f1f2e0307d7f3998e45c0d9ef
    with:
      policy_source_ref: 89a2a8b4c7571965249bed745bf7c5c37a1221f1
      required_main_workflow: Firmware CI
      required_check_contexts: '["Trusted Delivery qualification / Qualify trusted delivery"]'
      repository_role: active_source
      coverage_artifact_name: esp32-native-cobertura-coverage
