name: Temporary Mac mini runner canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: [self-hosted, macOS, ARM64, internal-release, private-network-deployment]
    timeout-minutes: 5
    steps:
      - name: Confirm Mac mini runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = djconnect-esp32-firmware-macmini
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          sw_vers
