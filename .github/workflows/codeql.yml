name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "24 4 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@b02217ab54ff5a93e9ba5ae406ac608f43ff8792
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect-esp32

  analyze:
    name: Analyze C/C++
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio

      - name: Build firmware for analysis
        run: pio run -e t_embed_cc1101

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  cleanup-workflow-runs:
    needs:
      - analyze
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete older completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          KEEP_RUNS: "2"
        run: |
          set -euo pipefail

          current_workflow_id=$(gh api \
            "repos/${REPO}/actions/runs/${CURRENT_RUN_ID}" \
            --jq '.workflow_id')

          workflows=$(gh api \
            --paginate \
            --slurp \
            "repos/${REPO}/actions/workflows" | \
            jq -r 'map(.workflows[]) | .[].id')

          for workflow_id in ${workflows}; do
            keep_limit="${KEEP_RUNS}"
            if [ "${workflow_id}" = "${current_workflow_id}" ]; then
              keep_limit=$((KEEP_RUNS - 1))
            fi

            mapfile -t run_ids < <(gh api \
              --paginate \
              --slurp \
              "repos/${REPO}/actions/workflows/${workflow_id}/runs?status=completed&per_page=100" | \
              jq -r 'map(.workflow_runs[]) | sort_by(.created_at) | reverse | .[].id')

            if ((${#run_ids[@]} <= keep_limit)); then
              continue
            fi

            for index in "${!run_ids[@]}"; do
              run_id="${run_ids[${index}]}"
              if ((index < keep_limit)) || [ "${run_id}" = "${CURRENT_RUN_ID}" ]; then
                continue
              fi

              gh api \
                --method DELETE \
                "repos/${REPO}/actions/runs/${run_id}"
            done
          done
