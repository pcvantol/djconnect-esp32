name: Secret scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@aabd5de46ae438478eb894707e5b1ea27aca8508
    with:
      execution_profile: balanced
      owner: djconnect-music-dj/djconnect-esp32

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks

      - name: Scan for committed secrets
        id: scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          scan_options=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ || ! "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::Missing or invalid commit range for the secret scan"
              exit 1
            fi
            if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
              scan_options+=("--log-opts=$HEAD_SHA")
            else
              scan_options+=("--log-opts=$BASE_SHA..$HEAD_SHA")
            fi
          fi
          "$RUNNER_TEMP/gitleaks" git --redact=100 \
            --report-format=sarif --report-path="$RUNNER_TEMP/gitleaks.sarif" \
            "${scan_options[@]}" .

      - name: Upload redacted scan report
        if: ${{ failure() && steps.scan.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: ignore

  cleanup-workflow-runs:
    needs:
      - gitleaks
    # Preserve CI and release evidence; cleanup must not run automatically.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete older completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          KEEP_RUNS: "2"
        run: |
          set -euo pipefail

          current_workflow_id=$(gh api \
            "repos/${REPO}/actions/runs/${CURRENT_RUN_ID}" \
            --jq '.workflow_id')

          workflows=$(gh api \
            --paginate \
            --slurp \
            "repos/${REPO}/actions/workflows" | \
            jq -r 'map(.workflows[]) | .[].id')

          for workflow_id in ${workflows}; do
            keep_limit="${KEEP_RUNS}"
            if [ "${workflow_id}" = "${current_workflow_id}" ]; then
              keep_limit=$((KEEP_RUNS - 1))
            fi

            mapfile -t run_ids < <(gh api \
              --paginate \
              --slurp \
              "repos/${REPO}/actions/workflows/${workflow_id}/runs?status=completed&per_page=100" | \
              jq -r 'map(.workflow_runs[]) | sort_by(.created_at) | reverse | .[].id')

            if ((${#run_ids[@]} <= keep_limit)); then
              continue
            fi

            for index in "${!run_ids[@]}"; do
              run_id="${run_ids[${index}]}"
              if ((index < keep_limit)) || [ "${run_id}" = "${CURRENT_RUN_ID}" ]; then
                continue
              fi

              gh api \
                --method DELETE \
                "repos/${REPO}/actions/runs/${run_id}"
            done
          done
