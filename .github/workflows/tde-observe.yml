name: TDE observe

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tde-observe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: TDE observe (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Generate canonical coverage input
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio gcovr
          mkdir -p release/ci-native
          REPORT_DIR=release/ci-native scripts/update_build_dependencies.sh t_embed_cc1101
          scripts/run_native_coverage.sh

      - name: Install published TDE runtime
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5; do
            if python -m pip install --no-cache-dir "technical-debt-engine-runtime==1.1.1"; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "The exact public TDE 1.1.1 distribution was unavailable after 5 attempts."
              exit 1
            fi
            echo "TDE 1.1.1 is not yet visible on this PyPI index; retrying in 15 seconds."
            sleep 15
          done
          mkdir -p "$RUNNER_TEMP/tde-tools"
          curl --fail --silent --show-error --location \
            https://github.com/AlDanial/cloc/releases/download/v2.10/cloc-2.10.pl \
            --output "$RUNNER_TEMP/tde-tools/cloc"
          echo "bf59272455172108072a0a106379f7509fd4349bdcfd85203bac038ccd286d83  $RUNNER_TEMP/tde-tools/cloc" | sha256sum --check
          chmod +x "$RUNNER_TEMP/tde-tools/cloc"
          "$RUNNER_TEMP/tde-tools/cloc" --version
          echo "$RUNNER_TEMP/tde-tools" >> "$GITHUB_PATH"

      - name: Run TDE standard assessment in observe mode
        id: tde
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p tde-observe
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          started_seconds="$(date +%s)"

          tde --version | tee tde-observe/runtime-version.txt

          set +e
          tde --format json --profile standard assess . > tde-observe/assessment.json
          assessment_exit="$?"
          tde --format json \
            --repository-definition .github/tde/repository-definition.json \
            qualify . > tde-observe/qualification.json
          qualification_exit="$?"
          set -e

          completed_seconds="$(date +%s)"
          duration_seconds="$((completed_seconds - started_seconds))"
          capabilities="$(jq -r '.evidence.assessment.executedCapabilities | join(", ")' tde-observe/assessment.json 2>/dev/null || echo unavailable)"
          assessment_decision="$(jq -r '.evidence.assessmentDecision.decision // "unavailable"' tde-observe/assessment.json 2>/dev/null || echo unavailable)"
          qualification_status="$(jq -r '.repositoryQualification.qualificationStatus // "unavailable"' tde-observe/qualification.json 2>/dev/null || echo unavailable)"

          {
            echo "# TDE observe result"
            echo
            echo "- Runtime: \`technical-debt-engine-runtime==1.1.1\`"
            echo "- Assessment profile: \`standard\`"
            echo "- Executed capabilities: ${capabilities}"
            echo "- Assessment decision: ${assessment_decision}"
            echo "- Repository qualification: ${qualification_status}"
            echo "- Assessment exit code: ${assessment_exit} (observed only)"
            echo "- Qualification exit code: ${qualification_exit} (observed only)"
            echo "- Duration: ${duration_seconds}s"
            echo "- Started: ${started_at}"
            echo "- Evidence artifact: \`tde-observe-evidence\`"
          } | tee tde-observe/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish TDE observe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tde-observe-evidence
          path: |
            release/native-coverage/djconnect-esp32-native-coverage.xml
            tde-observe/
            .tde/evidence/
            .tde/qualifications/
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve observe mode
        if: always()
        run: |
          echo "TDE observation is intentionally non-blocking."
          exit 0
